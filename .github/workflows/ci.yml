name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    # Sema datasource'unda url + directUrl var; prisma CLI ikisini de DB'ye
    # hic baglanmadan once cozmeye calisir, tanimsizsa P1012 ile durur.
    # Bu job gercekten baglanmadigi icin degerler sahte olabilir.
    env:
      DATABASE_URL: "postgresql://postgres:ci@localhost:5432/tello_ci"
      DIRECT_URL: "postgresql://postgres:ci@localhost:5432/tello_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma client uret (tip kontrolu icin gerekli, DB'ye baglanmaz)
        run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    # Testler artik CI'a ozel, tek seferlik bir Postgres container'ina
    # baglaniyor - paylasilan takim DB'sine hic dokunulmuyor, secret
    # gerekmiyor ve her PR'da gercekten calisiyor (onceden RUN_DB_TESTS
    # repo variable'i 'true' degilse bu job tamamen atlaniyordu).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tello_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:ci@localhost:5432/tello_ci"
      # migrate/generate icin session-mode adres. CI'daki Postgres zaten
      # dogrudan baglanti (pooler yok), o yuzden DATABASE_URL ile ayni.
      DIRECT_URL: "postgresql://postgres:ci@localhost:5432/tello_ci"
      JWT_SECRET: "ci-test-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
