name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma client uret (tip kontrolu icin gerekli, DB'ye baglanmaz)
        run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    # Testler gercek bir Postgres'e (Prisma) baglaniyor. Paylasilan takim
    # DB'sini CI'dan kirletmemek icin ayri bir TEST_DATABASE_URL secret'i
    # bekleniyor (ideal: Supabase branching ile izole bir test DB'si).
    # Secret tanimli degilse bu job atlanir, tsc+lint gate yine de calisir.
    if: ${{ vars.RUN_DB_TESTS == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
